<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Navigation Bar</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #89c440;
            width: 800px;
        }

        li {
            float: left;
            width: 200px;
        }

        li a {
            display: block;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            text-align: center;
            padding: 10px 0;
            text-decoration: none;
        }

        li a:hover {
            background-color: #7ab332;
        }
    </style>
</head>
<body>

    <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">NEWS</a></li>
        <li><a href="#">CONTACT</a></li>
        <li><a href="#">ABOUT</a></li>
    </ul>

</body>
</html>
