<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5.1 - jQuery Slide Toggle</title>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #flip {
            padding: 12px;
            text-align: center;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }

        #flip:hover {
            background-color: #0056b3;
        }

        #panel {
            padding: 40px 20px;
            text-align: center;
            background-color: #e9ecef;
            border: 2px solid #007bff;
            border-radius: 6px;
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>jQuery slideToggle() Demo</h2>
        <p>Click the button below to slide up and down the panel.</p>

        <!-- Toggle Button -->
        <button id="flip">Click to Slide Toggle Panel</button>

        <!-- Target Div -->
        <div id="panel">
            👋 Hello! I am a sliding div panel.
        </div>
    </div>

    <script>
        $(document).ready(function(){
            // Use jQuery slideToggle method to slide up and down
            $("#flip").click(function(){
                $("#panel").slideToggle("slow");
            });
        });
    </script>

</body>
</html>
