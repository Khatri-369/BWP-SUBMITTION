<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 7.1 - Cricket Players XML & XSD Schema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #007bff;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #dddddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏏 Cricket Players Collection (XML & XSD)</h2>
        <p style="text-align: center; color: #666;">Data loaded from <code>players.xml</code> validated against <code>players.xsd</code> schema.</p>

        <table>
            <thead>
                <tr>
                    <th>Player Name</th>
                    <th>Age</th>
                    <th>Batting Average</th>
                    <th>Highest Score</th>
                </tr>
            </thead>
            <tbody id="playerTableBody">
                <tr>
                    <td colspan="4">Loading XML data...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function loadXML() {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "players.xml", true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var xmlDoc = xhr.responseXML;
                    var players = xmlDoc.getElementsByTagName("player");
                    var html = "";

                    for (var i = 0; i < players.length; i++) {
                        var name = players[i].getElementsByTagName("player-name")[0].childNodes[0].nodeValue;
                        var age = players[i].getElementsByTagName("age")[0].childNodes[0].nodeValue;
                        var avg = players[i].getElementsByTagName("batting-average")[0].childNodes[0].nodeValue;
                        var hs = players[i].getElementsByTagName("highest-score")[0].childNodes[0].nodeValue;

                        html += "<tr>";
                        html += "<td><strong>" + name + "</strong></td>";
                        html += "<td>" + age + "</td>";
                        html += "<td>" + avg + "</td>";
                        html += "<td>" + hs + "</td>";
                        html += "</tr>";
                    }

                    document.getElementById("playerTableBody").innerHTML = html;
                }
            };
            xhr.send();
        }

        window.onload = loadXML;
    </script>

</body>
</html>
