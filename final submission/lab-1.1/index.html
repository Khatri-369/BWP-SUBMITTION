<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Side Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #ffffff;
        }

        .container-box {
            display: flex;
            width: 600px;
            min-height: 420px;
            border: 1px solid #000000;
        }

        .side-menu {
            width: 270px;
            border-right: 1px solid #000000;
            padding: 15px 20px;
            box-sizing: border-box;
        }

        .side-menu h4 {
            margin-top: 5px;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #000000;
        }

        .side-menu ul {
            margin-top: 0;
            margin-bottom: 20px;
            padding-left: 22px;
        }

        .side-menu li {
            margin: 6px 0;
            font-size: 13px;
        }

        .side-menu a {
            color: #0044cc;
            text-decoration: underline;
        }

        .side-menu a:hover {
            color: #002277;
        }

        .content-area {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="container-box">
        <!-- Left Side Menu Column -->
        <div class="side-menu">
            <h4>Computers & Accessories</h4>
            <ul>
                <li><a href="#">Accessories &amp; Peripherals</a></li>
                <li><a href="#">Components</a></li>
                <li><a href="#">Desktops</a></li>
                <li><a href="#">External Devices &amp; Data Storage</a></li>
                <li><a href="#">Laptops</a></li>
            </ul>

            <h4>Price</h4>
            <ul>
                <li><a href="#">Under &#8377;1,000</a></li>
                <li><a href="#">&#8377;1,000 - &#8377;5,000</a></li>
                <li><a href="#">&#8377;5,000 - &#8377;10,000</a></li>
                <li><a href="#">&#8377;10,000 - &#8377;20,000</a></li>
                <li><a href="#">Over &#8377;20,000</a></li>
            </ul>
        </div>

        <!-- Right Content Area -->
        <div class="content-area">
        </div>
    </div>

</body>
</html>
