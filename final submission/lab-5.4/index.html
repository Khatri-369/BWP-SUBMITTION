<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5.4 - jQuery Animate Font Size Slow</title>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #e83e8c;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }

        button:hover {
            background-color: #d63384;
        }

        #textDiv {
            font-size: 20px;
            color: #20c997;
            font-weight: bold;
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 6px;
            border: 2px dashed #20c997;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>jQuery animate() Font Size (Slow)</h2>
        <p>Click the button to set the font-size of the div to 100px with a <strong>slow</strong> duration.</p>

        <button id="growBtn">Increase Font Size (100px Slow)</button>
        <button id="resetBtn" style="background-color: #6c757d;">Reset Font Size</button>

        <!-- Target Div -->
        <div id="textDiv">
            jQuery Animation
        </div>
    </div>

    <script>
        $(document).ready(function(){
            // Set font-size to 100px with duration 'slow'
            $("#growBtn").click(function(){
                $("#textDiv").animate({
                    fontSize: '100px'
                }, 'slow');
            });

            // Reset font-size to 20px
            $("#resetBtn").click(function(){
                $("#textDiv").animate({
                    fontSize: '20px'
                }, 'slow');
            });
        });
    </script>

</body>
</html>
