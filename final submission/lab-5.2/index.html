<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5.2 - jQuery Animate Move Right</title>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background-color: #28a745;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
        }

        button:hover {
            background-color: #218838;
        }

        .box-container {
            position: relative;
            height: 120px;
            background-color: #e9ecef;
            border-radius: 6px;
            padding: 10px;
        }

        #box {
            background-color: #007bff;
            color: #ffffff;
            width: 100px;
            height: 100px;
            position: absolute;
            left: 10px;
            top: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>jQuery animate() Move Right</h2>
        <p>Click the button to move the box 250 pixels to the right.</p>

        <button id="moveBtn">Move 250px Right</button>
        <button id="resetBtn" style="background-color: #dc3545;">Reset</button>

        <div class="box-container">
            <div id="box">MOVE ME</div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            // Animate 250px to the right
            $("#moveBtn").click(function(){
                $("#box").animate({
                    left: '250px'
                });
            });

            // Reset box position
            $("#resetBtn").click(function(){
                $("#box").animate({
                    left: '10px'
                });
            });
        });
    </script>

</body>
</html>
