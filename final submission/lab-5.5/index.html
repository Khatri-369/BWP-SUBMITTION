<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5.5 - Cartoon Animation using jQuery</title>
    <!-- Include jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 40px;
            text-align: center;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stage {
            position: relative;
            height: 300px;
            background: linear-gradient(to bottom, #87ceeb 0%, #e0f6ff 70%, #90ee90 70%, #76c776 100%);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
            border: 2px solid #555;
        }

        /* Cartoon Character */
        #cartoon {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 100px;
            height: 100px;
            background-color: #ffcc00;
            border: 3px solid #333;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Cartoon Face Elements */
        .eye {
            position: absolute;
            top: 28px;
            width: 14px;
            height: 20px;
            background-color: #333;
            border-radius: 50%;
        }

        .eye.left { left: 25px; }
        .eye.right { right: 25px; }

        .pupil {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            bottom: 22px;
            left: 30px;
            width: 40px;
            height: 20px;
            border-bottom: 4px solid #333;
            border-radius: 0 0 20px 20px;
        }

        /* Buttons */
        .btn-group {
            margin-top: 20px;
        }

        button {
            background-color: #ff5722;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 0 6px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: #e64a19;
        }

        .btn-green { background-color: #4caf50; }
        .btn-green:hover { background-color: #388e3c; }

        .btn-blue { background-color: #2196f3; }
        .btn-blue:hover { background-color: #1976d2; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cartoon Animation using jQuery</h2>
        <p>Click the buttons below to trigger jQuery sequential animations on the cartoon character!</p>

        <div class="btn-group">
            <button id="startAnim" class="btn-green">▶ Play Full Cartoon Walk & Jump</button>
            <button id="jumpAnim" class="btn-blue">🦘 High Jump</button>
            <button id="resetAnim" style="background-color: #9e9e9e;">🔄 Reset Position</button>
        </div>

        <!-- Animation Stage -->
        <div class="stage">
            <div id="cartoon">
                <div class="eye left"><div class="pupil"></div></div>
                <div class="eye right"><div class="pupil"></div></div>
                <div class="mouth"></div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            
            // 1. Full Cartoon Walk, Jump & Scale Animation Sequence
            $("#startAnim").click(function(){
                var char = $("#cartoon");
                
                // Reset first
                char.stop(true, true).css({ left: '30px', bottom: '30px', width: '100px', height: '100px' });

                // Chained jQuery Animations
                char.animate({ left: '250px' }, 1000)                   // Walk right to middle
                    .animate({ bottom: '150px' }, 400)                  // Jump up
                    .animate({ bottom: '30px' }, 400)                   // Land down
                    .animate({ left: '550px' }, 1000)                   // Walk to right side
                    .animate({ width: '130px', height: '130px' }, 300)   // Grow big
                    .animate({ width: '100px', height: '100px' }, 300)   // Shrink back
                    .animate({ left: '30px' }, 1200);                   // Walk back home
            });

            // 2. High Jump Animation
            $("#jumpAnim").click(function(){
                var char = $("#cartoon");
                char.animate({ bottom: '170px' }, 400)
                    .animate({ bottom: '30px' }, 400);
            });

            // 3. Reset Animation
            $("#resetAnim").click(function(){
                $("#cartoon").stop(true, true).animate({
                    left: '30px',
                    bottom: '30px',
                    width: '100px',
                    height: '100px'
                }, 500);
            });

        });
    </script>

</body>
</html>
