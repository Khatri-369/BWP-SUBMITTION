<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4.2 - Typewriter Effect</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .typewriter-box {
            background-color: #2b2b2b;
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 30px;
            width: 600px;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        h2 {
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 0;
        }

        #typewriter {
            font-size: 20px;
            min-height: 80px;
            line-height: 1.5;
            white-space: pre-wrap;
            border-right: 3px solid #00ff66;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #00ff66; }
        }

        .controls {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background-color: #00ff66;
            color: #1e1e1e;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }

        button:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div class="typewriter-box">
        <h2>Type Writer Effect</h2>
        <hr style="border-color: #444;">
        
        <div id="typewriter"></div>

        <div class="controls">
            <button onclick="startTypewriter()">Start Typing</button>
            <button onclick="resetTypewriter()">Reset</button>
        </div>
    </div>

    <script>
        var text = "Hello! Welcome to the DHTML & JavaScript Typewriter Demonstration. This text is typed out character by character dynamically.";
        var index = 0;
        var speed = 70;
        var timer;

        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                timer = setTimeout(typeWriter, speed);
            }
        }

        function startTypewriter() {
            resetTypewriter();
            typeWriter();
        }

        function resetTypewriter() {
            clearTimeout(timer);
            index = 0;
            document.getElementById("typewriter").innerHTML = "";
        }

        // Auto start on page load
        window.onload = startTypewriter;
    </script>

</body>
</html>
