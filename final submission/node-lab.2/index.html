<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Node-2 - Armstrong Number Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #007bff;
        }

        input {
            width: 150px;
            padding: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .result-box {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 6px;
        }

        .is-armstrong {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .not-armstrong {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔢 Armstrong Number Checker</h2>
        <p style="color: #666; font-size: 14px;">Checks whether the number read from <code>number.txt</code> is an Armstrong number.</p>

        <label for="numInput"><strong>Number from File:</strong></label><br>
        <input type="number" id="numInput" value="153"><br>

        <button onclick="checkArmstrong()">Check Armstrong</button>

        <div id="resultBox" class="result-box is-armstrong">
            153 IS an Armstrong Number! (1³ + 5³ + 3³ = 153)
        </div>
    </div>

    <script>
        function checkArmstrong() {
            var numStr = document.getElementById("numInput").value.trim();
            var num = parseInt(numStr);
            var len = numStr.length;
            var sum = 0;

            for (var i = 0; i < len; i++) {
                var digit = parseInt(numStr.charAt(i));
                sum += Math.pow(digit, len);
            }

            var resultBox = document.getElementById("resultBox");

            if (sum === num) {
                resultBox.className = "result-box is-armstrong";
                resultBox.innerText = num + " IS an Armstrong Number!";
            } else {
                resultBox.className = "result-box not-armstrong";
                resultBox.innerText = num + " is NOT an Armstrong Number.";
            }
        }
    </script>

</body>
</html>
